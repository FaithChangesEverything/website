name: Temporary Next.js security lockfile refresh
on:
  push:
    branches:
      - security/nextjs-16-4-3
    paths:
      - .github/workflows/fce-temp-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  regenerate-lock:
    if: github.repository == 'FaithChangesEverything/website'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out security branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: true
      - name: Update patched Next.js and matching eslint-config-next
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.next=16.4.3' 'devDependencies.eslint-config-next=16.4.3'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies.next !== '16.4.3' ||
              pkg.devDependencies['eslint-config-next'] !== '16.4.3' ||
              lock.packages['node_modules/next']?.version !== '16.4.3' ||
              lock.packages['node_modules/eslint-config-next']?.version !== '16.4.3') {
            throw new Error('Security dependency versions are inconsistent');
          }
          console.log('Next.js and ESLint config patched and lockfile synchronized.');
          NODE
      - name: Save updated dependency manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Patch Next.js and eslint-config-next to 16.4.3'
          git push origin HEAD:security/nextjs-16-4-3
